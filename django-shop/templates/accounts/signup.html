{% extends "base.html" %}
{% block title %}Créer un compte — Ordinateur+{% endblock %}
{% block content %}
<form method="post" class="form narrow" novalidate>{% csrf_token %}
  <h1>Créer un compte</h1>
  {% for field in form %}<label>{{ field.label }}{{ field }}{{ field.errors }}</label>{% endfor %}
  <button class="btn btn-primary btn-block">Créer mon compte</button>
  <p class="muted small">Déjà inscrit ? <a href="{% url 'accounts:login' %}">Se connecter</a></p>
</form>
{% endblock %}
