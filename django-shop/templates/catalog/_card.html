{% load shop %}<article class="card">
  <a href="{{ p.get_absolute_url }}" class="card-media" aria-hidden="true" tabindex="-1"><span>{{ p.category.icon|default:"🖥️" }}</span></a>
  <div class="card-body">
    <p class="muted small">{{ p.brand }} · {{ p.category }}</p>
    <h3><a href="{{ p.get_absolute_url }}">{{ p.name }}</a></h3>
    <p class="muted small clamp">{{ p.description }}</p>
    <div class="card-footer">
      <strong class="price">{{ p.price_cents|euros }}</strong>
      {% if p.stock > 0 %}
      <form method="post" action="{% url 'cart:add' p.pk %}">{% csrf_token %}
        <input type="hidden" name="next" value="{{ request.get_full_path }}">
        <button class="btn btn-primary btn-sm">Ajouter</button>
      </form>
      {% else %}<button class="btn btn-sm" disabled>Rupture</button>{% endif %}
    </div>
  </div>
</article>
